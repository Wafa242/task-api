version: '3.8'

services:
  task-api:
    image: wafabousnina24/task-api:latest
    container_name: task-api-compose
    ports:
      - "5000:5000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/tasks\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
